name: Release

# push به main          → ایمیج ghcr.io/yunessfa/diba-mcp:latest
# Run workflow (دستی)    → نسخه‌ی package.json منتشر می‌شود:
#   یا push تگ vX.Y.Z      - ایمیج :X.Y.Z
#                          - GitHub Release با فایل نصب diba-mcp-X.Y.Z.tgz
#                          - انتشار روی npm (اگر secret به اسم NPM_TOKEN تنظیم شده باشد)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/diba-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.meta.outputs.version }},enable=${{ needs.meta.outputs.release }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=dibaMCP
            org.opencontainers.image.description=MCP server for Iranian messengers with a Persian dashboard
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
      - run: npm pack
      - name: GitHub Release (creates the tag if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "diba-mcp-$VERSION.tgz" --clobber
          else
            gh release create "v$VERSION" "diba-mcp-$VERSION.tgz" --target "$GITHUB_SHA" \
              --title "dibaMCP v$VERSION" --generate-notes
          fi
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public --provenance --ignore-scripts
